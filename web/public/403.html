<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>403 — Not Authorized</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
      }
      .status { font-size: 4rem; font-weight: 700; color: #f85149; line-height: 1; }
      h1 { margin: 0.75rem 0 1rem; font-size: 1.25rem; color: #e6edf3; }
      p { color: #8b949e; line-height: 1.6; }
      .divider { border: none; border-top: 1px solid #30363d; margin: 1.5rem 0; }
      a {
        color: #58a6ff;
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status">403</div>
      <h1>Not Authorized</h1>
      <p>
        You are authenticated but do not have the
        <strong>stfc_operator</strong> role required to access this
        application.
      </p>
      <hr class="divider" />
      <p>Contact the operator to be invited, or sign in with a different account.</p>
      <p style="margin-top:1rem;">
        <a href="/.auth/logout">Sign out</a>
      </p>
    </div>
  </body>
</html>
