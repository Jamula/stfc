name: Squad Reviewer Gate

# pull_request_target and issue_comment load this workflow from the default
# branch. Never check out or execute code from the pull request head here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, converted_to_draft, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: squad-reviewer-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    name: Evaluate reviewer verdicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Evaluate current-head reviewer verdicts
        env:
          REVIEW_GATE_TOKEN: ${{ github.token }}
        run: node scripts/reviewer-gate.mjs "$GITHUB_EVENT_PATH"
