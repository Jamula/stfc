name: Squad Heartbeat (Ralph)
# ⚠️ SYNC: This workflow is maintained in 4 locations. Changes must be applied to all:
#   - templates/workflows/squad-heartbeat.yml (source template)
#   - packages/squad-cli/templates/workflows/squad-heartbeat.yml (CLI package)
#   - .squad/templates/workflows/squad-heartbeat.yml (installed template)
#   - .github/workflows/squad-heartbeat.yml (active workflow)
# Run 'squad upgrade' to sync installed copies from source templates.

on:
  # React to completed work or new squad work
  issues:
    types: [closed, labeled]
  pull_request:
    types: [closed]

  # Manual trigger
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4

      - name: Check triage script
        id: check-script
        run: |
          if [ -f ".squad/templates/ralph-triage.js" ]; then
            echo "has_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_script=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ ralph-triage.js not found — run 'squad upgrade' to install"
          fi

      - name: Ralph — Smart triage
        if: steps.check-script.outputs.has_script == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .squad/templates/ralph-triage.js \
            --squad-dir .squad \
            --output triage-results.json

      # Reads { retroGate, results, canProceed } from ralph-triage.js and
      # sets a step output so the two steps below can gate on the EXACT
      # same fail-closed condition the dispatcher itself used (#248 Garak
      # finding 1 — "the later Assign @copilot step still ran under
      # if: success() despite an overdue/unevaluated gate"). Any missing
      # file, unparseable JSON, or older bare-array output (no `canProceed`
      # field) is treated as NOT proceeding — fail closed, never fail open.
      # Reads { retroGate, results, canProceed } from ralph-triage.js and
      # sets a step output so the two steps below can gate on the EXACT
      # same fail-closed condition the dispatcher itself used (#248 Garak
      # finding 1 — "the later Assign @copilot step still ran under
      # if: success() despite an overdue/unevaluated gate"). Any missing
      # file, unparseable JSON, or older bare-array output (no `canProceed`
      # field) is treated as NOT proceeding — fail closed, never fail open.
      # The retro-specific warning is emitted HERE, not in the downstream
      # steps, because those steps only run when can_proceed == 'true' —
      # an overdue/unevaluated result never reaches them, so a warning
      # placed there would be dead code (#248 Copilot review finding).
      - name: Ralph — Check retro gate
        id: retro-gate
        if: steps.check-script.outputs.has_script == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const path = "triage-results.json";
            let canProceed = false;
            try {
              const raw = fs.readFileSync(path, "utf8");
              const data = JSON.parse(raw);
              if (Array.isArray(data)) {
                canProceed = false;
              } else {
                canProceed = data.canProceed === true;
                const retroGate = data.retroGate;
                if (retroGate) {
                  if (retroGate.evaluated && retroGate.overdue) {
                    console.log(`::warning::[RETRO] Overdue (backend: ${retroGate.backend}) — Ralph skipped issue triage this round. See .squad/skills/retro-enforcement/SKILL.md.`);
                  } else if (!retroGate.evaluated) {
                    console.log(`::warning::[RETRO] Round-start gate not evaluated for backend "${retroGate.backend}" — blocked this round (fail closed): ${retroGate.reason}`);
                  }
                }
              }
            } catch (e) {
              console.log(`::warning::Could not determine retro-gate status (${e.message}) — blocking this round (fail closed).`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `can_proceed=${canProceed}\n`);
          '

      - name: Ralph — Apply triage decisions
        if: steps.check-script.outputs.has_script == 'true' && steps.retro-gate.outputs.can_proceed == 'true' && hashFiles('triage-results.json') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const fs = require('fs');
            const path = 'triage-results.json';
            if (!fs.existsSync(path)) {
              core.info('No triage results — board is clear');
              return;
            }

            // ralph-triage.js writes { retroGate, results, canProceed } —
            // the round-start retro gate is evaluated before triage-queue
            // construction (issue #245; #248 Garak finding 1). This step
            // only ever runs when the "Ralph — Check retro gate" step
            // above already confirmed can_proceed == 'true', so results
            // here always reflects a real, non-overdue evaluation; the
            // retro-specific warning is emitted in that earlier step, not
            // here, since it would be unreachable dead code in this one.
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const results = Array.isArray(data) ? data : data.results;

            if (!results || results.length === 0) {
              core.info('📋 Board is clear — Ralph found no untriaged issues');
              return;
            }
            
            for (const decision of results) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: decision.issueNumber,
                  labels: [decision.label]
                });
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: decision.issueNumber,
                  body: [
                    '### 🔄 Ralph — Auto-Triage',
                    '',
                    `**Assigned to:** ${decision.assignTo}`,
                    `**Reason:** ${decision.reason}`,
                    `**Source:** ${decision.source}`,
                    '',
                    '> Ralph auto-triaged this issue using routing rules.',
                    '> To reassign, swap the `squad:*` label.'
                  ].join('\n')
                });
                
                core.info(`Triaged #${decision.issueNumber} → ${decision.assignTo} (${decision.source})`);
              } catch (e) {
                core.warning(`Failed to triage #${decision.issueNumber}: ${e.message}`);
              }
            }
            
            core.info(`🔄 Ralph triaged ${results.length} issue(s)`);

      # Copilot auto-assign step (uses PAT if available). Gated on the same
      # retro-gate output as the triage-apply step above (#248 Garak
      # finding 1 — this step previously ran unconditionally under
      # `if: success()` even when the retro gate was overdue/unevaluated,
      # starting other work despite the skill's Blocking Semantics).
      - name: Ralph — Assign @copilot issues
        if: success() && steps.check-script.outputs.has_script == 'true' && steps.retro-gate.outputs.can_proceed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) return;

            const content = fs.readFileSync(teamFile, 'utf8');

            // Check if @copilot is on the team with auto-assign
            const hasCopilot = content.includes('🤖 Coding Agent') || content.includes('@copilot');
            const autoAssign = content.includes('<!-- copilot-auto-assign: true -->');
            if (!hasCopilot || !autoAssign) return;

            // Find issues labeled squad:copilot with no assignee
            try {
              const { data: copilotIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'squad:copilot',
                state: 'open',
                per_page: 5
              });

              const unassigned = copilotIssues.filter(i =>
                !i.assignees || i.assignees.length === 0
              );

              if (unassigned.length === 0) {
                core.info('No unassigned squad:copilot issues');
                return;
              }

              // Get repo default branch
              const { data: repoData } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              for (const issue of unassigned) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    assignees: ['copilot-swe-agent[bot]'],
                    agent_assignment: {
                      target_repo: `${context.repo.owner}/${context.repo.repo}`,
                      base_branch: repoData.default_branch,
                      custom_instructions: `Read .squad/team.md for team context and .squad/routing.md for routing rules.`
                    }
                  });
                  core.info(`Assigned copilot-swe-agent[bot] to #${issue.number}`);
                } catch (e) {
                  core.warning(`Failed to assign @copilot to #${issue.number}: ${e.message}`);
                }
              }
            } catch (e) {
              core.info(`No squad:copilot label found or error: ${e.message}`);
            }
