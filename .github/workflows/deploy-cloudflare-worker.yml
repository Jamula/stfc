name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: 'worker/package-lock.json'

      - run: cd worker && npm ci
      - run: cd worker && npm test
      - run: cd worker && npm run typecheck

      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3 (verified via refs/tags/v4.1.3)
        with:
          command: deploy
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: |
          DEPLOYMENT_URL="${{ steps.deploy.outputs.deployment-url }}"
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ✅ Cloudflare Worker Deployed

          Deployed URL: \`$DEPLOYMENT_URL\`

          **Next step:** Copy the URL above into [Discord Developer Portal](https://discord.com/developers/applications) → Your Application → General Information → Interactions Endpoint URL
          EOF
