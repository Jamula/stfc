name: Squad Promotion Check

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request targeting main
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request and required checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A positive pull request number is required."
            exit 1
          fi
          PR=$(gh pr view "$PR_NUMBER" --json state,baseRefName)
          if [ "$(printf '%s' "$PR" | jq -r '.state')" != "OPEN" ] || \
             [ "$(printf '%s' "$PR" | jq -r '.baseRefName')" != "main" ]; then
            echo "::error::The pull request must be open and target main."
            exit 1
          fi
          gh pr checks "$PR_NUMBER" --required
          echo "Required checks passed. Merge through the normal protected pull request flow."
