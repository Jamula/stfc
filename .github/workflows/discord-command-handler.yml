name: Discord command handler

on:
  repository_dispatch:
    types: [discord-command]

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Garak (PR #250 review, round 2): `/game-state` is the only Discord
  # command that writes automation-state directly — scripts/discord-
  # handler.mjs commits and pushes the upload from inside this job. That is
  # exactly the writer the original race was about (a monitor run fetching
  # automation-state's tip *after* a handler push landed, then wholesale-
  # replacing data/discord — a fast-forward commit with nothing for the
  # push-retry loop to detect, silently deleting the upload), so `/game-
  # state` MUST join the same stfc-gift-redeemer lock as redeem.yml and
  # discord-monitor.yml. `/redeem-status` only reads docs/redeem-history.md
  # and `/trigger-redeem` only dispatches redeem.yml (itself already
  # serialized under stfc-gift-redeemer) — neither writes automation-state
  # from this job, so each gets its own per-command group instead of
  # queuing behind scheduled runs. discord-monitor persisting only its
  # owned paths (never data/discord/game-state) remains defense in depth
  # on top of this, not a substitute for it.
  #
  # Garak (PR #266 review): sharing the group is necessary but not
  # sufficient. With the default `queue: single` the group holds at most one
  # pending run, so the next redeem/monitor/refresh run would cancel a
  # pending `/game-state` job after the Worker already sent Discord its
  # deferred response — trading a post-push deletion race for pre-execution
  # upload loss. `queue: max` holds up to 100 pending runs in FIFO order and
  # applies to this workflow's isolated per-command groups too (they are
  # single-writer, so it is a no-op there, but it keeps one contract for the
  # whole file). See docs/ARCHITECTURE.md → "Writer serialization" for the
  # overflow contract. Never combine `queue: max` with
  # `cancel-in-progress: true` — GitHub rejects that as a validation error.
  #
  # GitHub's `==` and concurrency group names are both case-insensitive, so a
  # case variant like `GAME-STATE` resolves to the shared writer group and
  # over-serializes. scripts/discord-handler.mjs dispatches on exact lower-
  # case strings, so such a payload returns "Unknown command" without ever
  # touching git — safe in the conservative direction.
  group: ${{ github.event.client_payload.command == 'game-state' && 'stfc-gift-redeemer' || format('stfc-discord-handler-{0}', github.event.client_payload.command) }}
  queue: max
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate repository_dispatch payload
        env:
          DISCORD_CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$DISCORD_CLIENT_PAYLOAD" | jq -e '
            .command and (.command | type == "string" and length > 0) and
            .interaction_token and (.interaction_token | type == "string" and length > 0) and
            .application_id and (.application_id | type == "string" and length > 0)
          ' >/dev/null || {
            echo "::error::Missing required client_payload fields: command, interaction_token, application_id"
            exit 1
          }

      # Run the main-branch handler code with automation-state as its working
      # repository. Existing state is clean at checkout, /redeem-status sees
      # live history, and /game-state commits have an automation-state parent.
      - name: Prepare automation-state handler worktree
        id: state_worktree
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/automation-state-handler"
          rm -rf "$STATE_DIR"
          git worktree prune

          if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
            git fetch --depth=1 --no-tags origin \
              refs/heads/automation-state:refs/remotes/origin/automation-state
            git worktree add -B automation-state "$STATE_DIR" origin/automation-state
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to inspect origin/automation-state."
              exit "$status"
            fi
            echo "Bootstrapping automation-state in an authenticated linked worktree."
            git worktree add --detach "$STATE_DIR" HEAD
            git -C "$STATE_DIR" switch --orphan automation-state
            git -C "$STATE_DIR" rm -rf --cached --ignore-unmatch .
          fi

          if [ ! -f "$STATE_DIR/docs/redeem-history.md" ] \
            && [ -f "$GITHUB_WORKSPACE/docs/redeem-history.md" ]; then
            mkdir -p "$STATE_DIR/docs"
            cp "$GITHUB_WORKSPACE/docs/redeem-history.md" \
              "$STATE_DIR/docs/redeem-history.md"
          fi
          if [ ! -d "$STATE_DIR/data/discord/game-state" ] \
            && [ -d "$GITHUB_WORKSPACE/data/discord/game-state" ]; then
            mkdir -p "$STATE_DIR/data/discord"
            cp -a "$GITHUB_WORKSPACE/data/discord/game-state" \
              "$STATE_DIR/data/discord/game-state"
          fi

          echo "state_dir=$STATE_DIR" >> "$GITHUB_OUTPUT"
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Route command and post Discord follow-up
        if: steps.state_worktree.outputs.complete == 'true'
        working-directory: ${{ steps.state_worktree.outputs.state_dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ALLOWED_GUILD_IDS: ${{ secrets.ALLOWED_GUILD_IDS }}
          DISCORD_CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          STFC_STATE_BRANCH: automation-state
        run: node "$GITHUB_WORKSPACE/scripts/discord-handler.mjs"

      - name: Remove automation-state handler worktree
        if: always() && steps.state_worktree.outputs.complete == 'true'
        run: git worktree remove "${{ steps.state_worktree.outputs.state_dir }}" --force
