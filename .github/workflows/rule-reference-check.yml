# Catch dangling `Rule N` citations in governance/docs/skill files.
#
# After rule consolidation (PR #128 — Rules 6+12, 13+20, Rule 21/22 added),
# references to stale or non-existent rule numbers can drift silently.
# This workflow greps ADDED lines in a PR's diff and fails if any cited
# Rule N is not present in .github/copilot-instructions.md.
#
# "RESERVED — see Rule X" rules (12, 20) ARE in the canonical set and are
# therefore valid to cite — the heading still exists, it just redirects.
#
# Pin test: tests/skills/ruleReferenceCheck.test.ts (Rule 3)

name: Rule Reference Check

on:
  pull_request:
    paths:
      - ".squad/**"
      - ".github/copilot-instructions.md"
      - ".github/agents/squad.agent.md"
      - "docs/**"

concurrency:
  group: rule-ref-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check Rule N citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.0
        with:
          fetch-depth: 0

      - name: Validate Rule N references in changed files
        run: |
          set -euo pipefail

          # ── 1. Extract canonical rule numbers ────────────────────────────
          # Every heading of the form "## N." is a valid rule slot, including
          # "RESERVED — see Rule X" entries (they still have a heading).
          # || true prevents set -euo pipefail from aborting when the canonical
          # file contains no numbered headings; an empty set is a valid policy
          # state — any Rule N citation added in that state is dangling (step 4).
          CANONICAL=$(grep -oE '^## [0-9]+\.' .github/copilot-instructions.md \
            | grep -oE '[0-9]+' | sort -n || true)

          if [ -z "$CANONICAL" ]; then
            echo "ℹ️  No numbered headings found in copilot-instructions.md — canonical rule set is empty."
            echo "   Any 'Rule N' citation added in this PR is dangling by definition."
          else
            echo "Canonical rule numbers: $(echo "$CANONICAL" | tr '\n' ' ')"
          fi

          # ── 2. Get files changed in this PR ───────────────────────────────
          BASE_REF="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "${BASE_REF}...HEAD")

          TARGET=$(echo "$CHANGED" | grep -E \
            '^(\.squad/|docs/|\.github/copilot-instructions\.md|\.github/agents/squad\.agent\.md)' \
            || true)

          if [ -z "$TARGET" ]; then
            echo "No target files changed — nothing to check."
            exit 0
          fi

          echo "Checking files:"
          echo "$TARGET"

          # ── 3. Extract Rule N citations from ADDED lines only ────────────
          # Using added-lines-only prevents false positives from historical
          # records (e.g. .squad/decisions.md referencing deferred Rule 23).
          # shellcheck disable=SC2086
          ADDED=$(git diff "${BASE_REF}...HEAD" -- $TARGET \
            | grep '^+' | grep -v '^+++' || true)

          if [ -z "$ADDED" ]; then
            echo "No added lines in target files — nothing to check."
            exit 0
          fi

          CITED=$(echo "$ADDED" | grep -oE 'Rule [0-9]+' \
            | grep -oE '[0-9]+' | sort -un || true)

          if [ -z "$CITED" ]; then
            echo "✅ No 'Rule N' references in added content."
            exit 0
          fi

          echo "Cited rule numbers: $(echo "$CITED" | tr '\n' ' ')"

          # ── 4. Diff: cited minus canonical ────────────────────────────────
          DANGLING=""
          while IFS= read -r n; do
            if ! echo "$CANONICAL" | grep -qw "$n"; then
              DANGLING="${DANGLING}  Rule ${n}\n"
            fi
          done <<< "$CITED"

          if [ -n "$DANGLING" ]; then
            echo ""
            echo "❌ Dangling Rule references in this PR's added lines:"
            echo -e "$DANGLING"
            echo "These numbers do not exist in .github/copilot-instructions.md."
            echo "Either add the rule to copilot-instructions.md or fix the reference."
            exit 1
          fi

          echo "✅ All Rule N references are valid."
