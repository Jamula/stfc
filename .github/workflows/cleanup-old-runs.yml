name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 'Delete runs older than N days. Ignored if older_than_hours is set.'
        required: false
        default: '3'
      older_than_hours:
        description: 'Delete runs older than N hours. If set, takes precedence over older_than_days.'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Set cutoff timestamp
        id: cutoff
        env:
          DAYS: ${{ inputs.older_than_days }}
          HOURS: ${{ inputs.older_than_hours }}
        run: |
          if [[ -n "$HOURS" && "$HOURS" != "" ]]; then
            # Use hours logic if provided and non-empty
            [[ "$HOURS" =~ ^[1-9][0-9]*$ ]] || { echo "older_than_hours must be a positive integer, got: $HOURS"; exit 1; }
            CUTOFF=$(date -u -d "$HOURS hours ago" +"%Y-%m-%dT%H:%M:%SZ")
            MODE="hours"
            MODE_VALUE="$HOURS"
          else
            # Fall back to days logic
            [[ "$DAYS" =~ ^[1-9][0-9]*$ ]] || { echo "older_than_days must be a positive integer, got: $DAYS"; exit 1; }
            CUTOFF=$(date -u -d "$DAYS days ago" +"%Y-%m-%dT%H:%M:%SZ")
            MODE="days"
            MODE_VALUE="$DAYS"
          fi
          echo "cutoff=$CUTOFF" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode_value=$MODE_VALUE" >> "$GITHUB_OUTPUT"
          echo "Cutoff timestamp: $CUTOFF (using $MODE_VALUE $MODE)"

      - name: Enumerate and delete old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUTOFF: ${{ steps.cutoff.outputs.cutoff }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          
          deleted=0
          failed=0
          skipped_active=0
          already_deleted=0
          rate_limited=0
          server_errors=0
          total_found=0
          
          echo "Searching for runs created before: $CUTOFF"
          
          # Enumerate all runs older than cutoff, excluding in-progress/queued
          while IFS= read -r run_json; do
            total_found=$((total_found + 1))
            
            run_id=$(echo "$run_json" | jq -r '.id')
            created_at=$(echo "$run_json" | jq -r '.created_at')
            run_name=$(echo "$run_json" | jq -r '.name')
            status=$(echo "$run_json" | jq -r '.status')
            
            # Skip deleting this cleanup workflow's own run (prevent self-decapitation)
            if [ "$run_id" = "$THIS_RUN_ID" ]; then
              echo "⊘ Skipping own run: $run_id ($run_name, $status)"
              skipped_active=$((skipped_active + 1))
              continue
            fi
            
            # Delete the run
            if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
              [ $((deleted % 50)) -eq 0 ] && echo "  ✓ Deleted $deleted runs so far..."
            else
              echo "⚠ Delete failed for run $run_id — sleeping 5s and retrying once..."
              sleep 5

              if retry_output="$(gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>&1)"; then
                deleted=$((deleted + 1))
              elif echo "$retry_output" | grep -q "404"; then
                already_deleted=$((already_deleted + 1))
                [ $already_deleted -le 5 ] && echo "⊘ Already deleted: $run_id ($run_name, $status)"
              else
                failed=$((failed + 1))
                if echo "$retry_output" | grep -q "429"; then
                  rate_limited=$((rate_limited + 1))
                  [ $rate_limited -le 5 ] && echo "✗ Rate limited deleting $run_id ($run_name, $status)"
                elif echo "$retry_output" | grep -Eq "5[0-9][0-9]"; then
                  server_errors=$((server_errors + 1))
                  [ $server_errors -le 5 ] && echo "✗ Server error deleting $run_id ($run_name, $status)"
                else
                  [ $failed -le 5 ] && echo "✗ Failed to delete $run_id ($run_name, $status)"
                fi
              fi
            fi
            
            # 200ms throttle between requests (rate-limit safe)
            sleep 0.2
          done < <(
            gh api --paginate -X GET "repos/${{ github.repository }}/actions/runs" \
              -f "created=<$CUTOFF" \
              -f "per_page=100" \
              --jq '.workflow_runs[] | select(.status != "in_progress" and .status != "queued" and .status != "waiting") | {id, created_at, name, status}'
          )
          
          echo ""
          echo "=== Cleanup Summary ==="
          echo "Total found (before cutoff): $total_found"
          echo "Deleted: $deleted"
          echo "Failed: $failed"
          echo "Already deleted (404): $already_deleted"
          echo "Rate-limited failures (429): $rate_limited"
          echo "Server failures (5xx): $server_errors"
          echo "Skipped (own run): $skipped_active"
          
          # Write summary to job output
          {
            echo "## Cleanup Summary"
            echo ""
            echo "- **Mode**: Deleting runs older than ${{ steps.cutoff.outputs.mode_value }} ${{ steps.cutoff.outputs.mode }}"
            echo "- **Cutoff**: $CUTOFF"
            echo "- **Total runs found** (created before $CUTOFF): $total_found"
            echo "- **Deleted**: $deleted"
            echo "- **Failed**: $failed"
            echo "- **Already deleted** (404): $already_deleted"
            echo "- **Rate-limited failures** (429): $rate_limited"
            echo "- **Server failures** (5xx): $server_errors"
            echo "- **Skipped** (own run to prevent self-decapitation): $skipped_active"
          } >> "$GITHUB_STEP_SUMMARY"
