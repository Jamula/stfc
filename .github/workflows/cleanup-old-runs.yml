name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 'Delete runs older than N days (default: 3)'
        required: false
        default: '3'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Set cutoff timestamp
        id: cutoff
        env:
          DAYS: ${{ inputs.older_than_days }}
        run: |
          # Compute cutoff: current time minus N days
          CUTOFF=$(date -u -d "$DAYS days ago" +"%Y-%m-%dT%H:%M:%SZ")
          echo "cutoff=$CUTOFF" >> "$GITHUB_OUTPUT"
          echo "Cutoff timestamp: $CUTOFF"

      - name: Enumerate and delete old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUTOFF: ${{ steps.cutoff.outputs.cutoff }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          
          deleted=0
          failed=0
          skipped_active=0
          total_found=0
          
          echo "Searching for runs created before: $CUTOFF"
          
          # Enumerate all runs older than cutoff, excluding in-progress/queued
          gh api --paginate -X GET "repos/${{ github.repository }}/actions/runs" \
            -f "created=<$CUTOFF" \
            -f "per_page=100" \
            --jq '.workflow_runs[] | select(.status != "in_progress" and .status != "queued") | {id, created_at, name, status}' \
            | while IFS= read -r run_json; do
            
            ((total_found++))
            
            run_id=$(echo "$run_json" | jq -r '.id')
            created_at=$(echo "$run_json" | jq -r '.created_at')
            run_name=$(echo "$run_json" | jq -r '.name')
            status=$(echo "$run_json" | jq -r '.status')
            
            # Skip deleting this cleanup workflow's own run (prevent self-decapitation)
            if [ "$run_id" = "$THIS_RUN_ID" ]; then
              echo "⊘ Skipping own run: $run_id ($run_name, $status)"
              ((skipped_active++))
              continue
            fi
            
            # Delete the run
            if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>/dev/null; then
              ((deleted++))
              [ $((deleted % 50)) -eq 0 ] && echo "  ✓ Deleted $deleted runs so far..."
            else
              # Handle 429 rate limit with backoff
              if [ $((failed % 10)) -eq 0 ]; then
                echo "⚠ Rate limit or error on run $run_id — sleeping 30s..."
                sleep 30
                # Retry once
                if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" 2>/dev/null; then
                  ((deleted++))
                else
                  ((failed++))
                  [ $failed -le 5 ] && echo "✗ Failed to delete $run_id ($run_name, $status)"
                fi
              else
                ((failed++))
              fi
            fi
            
            # 200ms throttle between requests (rate-limit safe)
            sleep 0.2
          done
          
          echo ""
          echo "=== Cleanup Summary ==="
          echo "Total found (before cutoff): $total_found"
          echo "Deleted: $deleted"
          echo "Failed: $failed"
          echo "Skipped (own run): $skipped_active"
          
          # Write summary to job output
          {
            echo "## Cleanup Summary"
            echo ""
            echo "- **Total runs found** (created before $CUTOFF): $total_found"
            echo "- **Deleted**: $deleted"
            echo "- **Failed**: $failed"
            echo "- **Skipped** (own run to prevent self-decapitation): $skipped_active"
            echo ""
            echo "Cutoff days: ${{ inputs.older_than_days }}"
          } >> "$GITHUB_STEP_SUMMARY"
