name: Check recovery authentication

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stfc-gift-redeemer
  queue: max
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Verify legacy inventory and refresh without redemption
        env:
          STFC_ACCOUNTS: ${{ secrets.STFC_ACCOUNTS }}
          STFC_ACCOUNT_REFRESH: ${{ secrets.STFC_ACCOUNT_REFRESH }}
          STFC_ACCOUNT_REFRESH_RECOVERY: ${{ secrets.STFC_ACCOUNT_REFRESH_61690F065F04521CBA2CAE742A6BEC0DB2606A8E38A2FF74AEA5E1CB58D4E854 }}
          REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
        run: |
          node --input-type=module <<'NODE'
          import { mergeAvailableRefreshedAccounts, verifiedIdentity, verifyGiftAccess } from './scripts/refresh-account.ts';
          import { isTokenAccounts } from './shared/token-account-schema.ts';
          try {
            const vars = JSON.parse(process.env.REPOSITORY_VARIABLES);
            const keys = ['AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
              'AZURE_TOKEN_STORAGE_ACCOUNT', 'AZURE_TOKEN_CONTAINER', 'AZURE_TOKEN_BLOB'];
            if (keys.some(key => vars[key]?.trim())) throw new Error();
            if (!process.env.STFC_ACCOUNT_REFRESH_RECOVERY?.trim()) {
              console.error('::error::Required fresh recovery override is missing; no recovery validation was performed.');
              process.exit(1);
            }
            const accounts = JSON.parse(process.env.STFC_ACCOUNTS ?? '');
            if (!isTokenAccounts(accounts)) throw new Error();
            const priorOverride = process.env.STFC_ACCOUNT_REFRESH;
            const overrides = [priorOverride, process.env.STFC_ACCOUNT_REFRESH_RECOVERY].filter(value => value?.trim());
            const result = await mergeAvailableRefreshedAccounts(process.env.STFC_ACCOUNTS, overrides);
            const freshOverrideIndex = overrides.length - 1;
            if (!result.acceptedOverrides[freshOverrideIndex]) {
              console.error('::error::Fresh recovery override failed identity, uniqueness, or gift-access validation; no recovery validation was accepted.');
              process.exit(1);
            }
            if (priorOverride?.trim() && !result.acceptedOverrides[0]) {
              console.warn('::warning::The older refresh override was rejected; the accepted fresh override and baseline inventory remain in use.');
            }
            const effectiveAccounts = result.accounts;
            let authenticated = 0;
            for (const account of effectiveAccounts) {
              try {
                await verifiedIdentity(account.token);
                await verifyGiftAccess(account.token);
                authenticated++;
              } catch {}
            }
            console.log(`Non-redeeming authentication and gift-list access: ${authenticated}/${effectiveAccounts.length} accounts accepted.`);
            if (authenticated !== effectiveAccounts.length) {
              console.error('::error::One or more preserved accounts failed authentication.');
              process.exitCode = 1;
            }
          } catch {
            console.error('::error::Recovery configuration or exact account identity could not be verified; no redemption attempted.');
            process.exitCode = 1;
          }
          NODE
