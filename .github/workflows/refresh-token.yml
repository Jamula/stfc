# Auto-refresh the STFC store JWT.
#
# Logs in to the Scopely store via Playwright using STFC_EMAIL +
# STFC_PASSWORD secrets, captures the resulting JWT, and updates the
# STFC_ACCOUNTS repo secret (preserving any other accounts).
#
# Required secrets:
#   STFC_EMAIL          your Scopely login email
#   STFC_PASSWORD       your Scopely password (mapped from your `cj_pwd`
#                       secret in the Refresh step below if you prefer to
#                       keep the existing name)
#   STFC_REFRESH_PAT    fine-grained PAT with "Secrets: Read & write"
#                       permission for THIS repo. Default GITHUB_TOKEN
#                       cannot write secrets, hence the PAT requirement.
#
# Optional inputs (workflow_dispatch only):
#   account_name        which account in STFC_ACCOUNTS to refresh (default
#                       "main"). Set this if you have multiple accounts and
#                       want to refresh just one.
name: Refresh token

on:
  # Weekly refresh at Saturday 00:00 UTC. Pairs with Issue #13's
  # "all-accounts-expired" alarm: a weekly refresh keeps tokens far
  # from the 30-day expiry wall so the alarm only fires on real breakage.
  # Shares concurrency.group `stfc-gift-redeemer` with redeem.yml (and the
  # incoming discord-monitor.yml). A Saturday-midnight refresh may briefly
  # queue or cancel a redeem run — acceptable at weekly cadence.
  schedule:
    - cron: "0 0 * * 6"   # Saturday 00:00 UTC, weekly
  workflow_dispatch:
    inputs:
      account_name:
        description: "Account name in STFC_ACCOUNTS to refresh"
        type: string
        required: false
        default: "main"

permissions:
  contents: read

# Opt into the Node 24 runtime for actions/* internals (default June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Don't race with the redeem workflow (both touch STFC_ACCOUNTS).
concurrency:
  group: stfc-gift-redeemer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        # On a cache hit the browser binary is already present, so skip the
        # multi-minute CDN download from cdn.playwright.dev that previously
        # stalled and tripped the job timeout. The per-step timeout bounds a
        # cold-cache download so a stalled CDN fails fast and clearly instead
        # of silently consuming the whole job budget.
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Capture fresh JWT
        id: capture
        env:
          STFC_EMAIL: ${{ secrets.STFC_EMAIL }}
          STFC_PASSWORD: ${{ secrets.STFC_PASSWORD || secrets.cj_pwd }}
        run: |
          set -euo pipefail
          if [ -z "${STFC_EMAIL:-}" ] || [ -z "${STFC_PASSWORD:-}" ]; then
            echo "::error::STFC_EMAIL and STFC_PASSWORD (or cj_pwd) secrets must be set."
            exit 1
          fi
          NAME="${{ inputs.account_name || 'main' }}"
          # Capture into a file so we don't echo the JWT into the live log.
          # Stdout from --ci is exactly one line of JSON; stderr is diagnostic.
          npm --silent run capture-token -- --ci --name "$NAME" --timeout 180 \
            > /tmp/captured.json
          # Sanity check (without revealing the value)
          if ! jq -e '.token | length > 0' /tmp/captured.json > /dev/null; then
            echo "::error::capture-token produced no token."
            exit 1
          fi
          # Mask the token value in any subsequent log output.
          TOKEN=$(jq -r '.token' /tmp/captured.json)
          echo "::add-mask::$TOKEN"
          echo "captured=true" >> "$GITHUB_OUTPUT"

      - name: Merge with existing STFC_ACCOUNTS and update secret
        env:
          GH_TOKEN: ${{ secrets.STFC_REFRESH_PAT }}
          EXISTING: ${{ secrets.STFC_ACCOUNTS }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::STFC_REFRESH_PAT secret is missing. Create a fine-grained PAT scoped to this repo with 'Secrets: Read & write' permission, store it as STFC_REFRESH_PAT, and re-run."
            exit 1
          fi
          NEW_NAME=$(jq -r '.name' /tmp/captured.json)
          NEW_TOKEN=$(jq -r '.token' /tmp/captured.json)
          # Mask the new token value too (belt + braces; capture step also did this).
          echo "::add-mask::$NEW_TOKEN"

          # Build the merged JSON. If STFC_ACCOUNTS is unset/empty/invalid,
          # start from an empty array. Otherwise replace the matching name or
          # append a new entry.
          if [ -z "${EXISTING:-}" ]; then
            BASE='[]'
          else
            # Mask existing tokens too so they don't leak via diffs in case of error.
            for tok in $(echo "$EXISTING" | jq -r '.[].token // empty' 2>/dev/null || true); do
              echo "::add-mask::$tok"
            done
            BASE=$(echo "$EXISTING" | jq -c . 2>/dev/null || echo '[]')
          fi

          MERGED=$(jq -c --arg n "$NEW_NAME" --arg t "$NEW_TOKEN" '
            (map(select(.name != $n))) + [{name: $n, token: $t}]
          ' <<< "$BASE")

          # Push via gh (uses GH_TOKEN env var). Without --body, gh reads
          # the secret value from stdin — so it never lands on a command
          # line, in shell history, or in process listings.
          printf '%s' "$MERGED" | gh secret set STFC_ACCOUNTS \
            --repo "$GITHUB_REPOSITORY"

          # Cleanup the temp file with the JWT in it.
          rm -f /tmp/captured.json

          echo "✅ STFC_ACCOUNTS updated. Account refreshed: $NEW_NAME"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Refresh token"
            if [ "${{ steps.capture.outputs.captured }}" = "true" ]; then
              echo ""
              echo "✅ Captured a fresh JWT and updated the STFC_ACCOUNTS secret."
              echo "Account: \`${{ inputs.account_name || 'main' }}\`"
            else
              echo ""
              echo "❌ Refresh failed. Common causes:"
              echo "- STFC_EMAIL / STFC_PASSWORD secret missing or wrong"
              echo "- STFC_REFRESH_PAT secret missing or lacking secrets:write"
              echo "- Scopely served a CAPTCHA / MFA challenge to the headless browser"
              echo ""
              echo "Fall back to running \`npm run capture-token\` locally."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
