# One-time migration of the legacy STFC_ACCOUNTS secret into private Blob
# Storage. Real sign-in and token updates happen in the authenticated PWA.
name: Migrate token store

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stfc-gift-redeemer
  queue: max
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate existing account tokens
        env:
          STFC_ACCOUNTS: ${{ secrets.STFC_ACCOUNTS }}
        run: |
          set -euo pipefail
          : "${STFC_ACCOUNTS:?The legacy STFC_ACCOUNTS secret is required for migration}"

          account_file="$RUNNER_TEMP/stfc-accounts.json"
          printf '%s' "$STFC_ACCOUNTS" > "$account_file"
          chmod 600 "$account_file"
          unset STFC_ACCOUNTS

          node scripts/validate-token-accounts.mjs "$account_file"

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474  # v2.3.0
        with:
          client-id: ${{ vars.AZURE_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload account tokens
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_TOKEN_STORAGE_ACCOUNT }}
          AZURE_TOKEN_CONTAINER: ${{ vars.AZURE_TOKEN_CONTAINER }}
          AZURE_TOKEN_BLOB: ${{ vars.AZURE_TOKEN_BLOB }}
        run: |
          set -euo pipefail
          : "${AZURE_STORAGE_ACCOUNT:?AZURE_TOKEN_STORAGE_ACCOUNT variable is required}"
          : "${AZURE_TOKEN_CONTAINER:?AZURE_TOKEN_CONTAINER variable is required}"
          : "${AZURE_TOKEN_BLOB:?AZURE_TOKEN_BLOB variable is required}"

          az storage blob upload \
            --auth-mode login \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --container-name "$AZURE_TOKEN_CONTAINER" \
            --name "$AZURE_TOKEN_BLOB" \
            --file "$RUNNER_TEMP/stfc-accounts.json" \
            --overwrite false \
            --only-show-errors
          echo "The existing account list was migrated to the private token store."

      - name: Remove temporary account-token file
        if: always()
        run: rm -f "$RUNNER_TEMP/stfc-accounts.json"
