name: Squad Release Status

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report release result
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::The existing Release workflow concluded: $CONCLUSION"
            exit 1
          fi
          echo "The existing Release workflow succeeded."
