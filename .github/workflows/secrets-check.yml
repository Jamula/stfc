# Diagnostic: report which of the expected STFC_* secrets are set on this
# repo (by testing for non-emptiness in env). Reveals only true/false, never
# values or value-derived metadata. Safe to commit; safe to run.
name: Secrets check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report which secrets are defined
        env:
          STFC_ACCOUNTS_VAL: ${{ secrets.STFC_ACCOUNTS }}
          STFC_EMAIL_VAL: ${{ secrets.STFC_EMAIL }}
          STFC_PASSWORD_VAL: ${{ secrets.STFC_PASSWORD }}
          CJ_PWD_VAL: ${{ secrets.cj_pwd }}
          STFC_REFRESH_PAT_VAL: ${{ secrets.STFC_REFRESH_PAT }}
        run: |
          set -e
          report() {
            local variable="$1"
            if [ -n "${!variable:-}" ]; then
              echo "SET"
            else
              echo "UNSET"
            fi
          }
          {
            echo "## Repo secrets check"
            echo ""
            echo '```'
            report STFC_ACCOUNTS_VAL
            report STFC_EMAIL_VAL
            report STFC_PASSWORD_VAL
            report CJ_PWD_VAL
            report STFC_REFRESH_PAT_VAL
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
