# Diagnostic: report which of the expected STFC_* secrets are set on this
# repo (by testing for non-emptiness in env). Reveals only true/false, never
# values or value-derived metadata. Safe to commit; safe to run.
name: Secrets check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report which secrets are defined
        env:
          S1: ${{ secrets.STFC_ACCOUNTS }}
          S2: ${{ secrets.STFC_EMAIL }}
          S3: ${{ secrets.STFC_PASSWORD }}
          S4: ${{ secrets.cj_pwd }}
          S5: ${{ secrets.STFC_REFRESH_PAT }}
        run: |
          set -e
          report() {
            local variable="$1"
            if [ -n "${!variable:-}" ]; then
              echo "SET"
            else
              echo "UNSET"
            fi
          }
          {
            echo "## Repo secrets check"
            echo ""
            echo '```'
            report S1
            report S2
            report S3
            report S4
            report S5
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
