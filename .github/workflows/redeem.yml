# Scheduled web-store gift redemption.
#
# Reads STFC store JWTs from the STFC_ACCOUNTS secret (a JSON array of
# {name, token} objects) and runs the orchestrator against every account.
#
# Per-account outcomes (claimed, already-claimed, token-expired, code-used,
# etc.) do NOT fail the workflow — they are surfaced in the run summary.
# Only infrastructure failures (malformed secret, schema mismatch, uncaught
# crash) cause a non-zero exit.
name: Redeem gifts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes — 6x/hour, 144/day (was */15).
  workflow_dispatch: {}

permissions:
  # `write` so the post-run step can commit operational state to the
  # automation-state branch using the default GITHUB_TOKEN.
  contents: write
  # `issues: write` so a dead token raises a visible alert (exit code 2).
  issues: write

# Opt into the Node 24 runtime for actions/* internals (default June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Prevent cron + manual dispatch from racing.
#
# `queue: max` is mandatory for every workflow that can join this group
# (Garak, PR #266 review). The default `queue: single` keeps at most ONE
# pending run per group and cancels/replaces it whenever a newer run of ANY
# workflow in the group arrives — so a 10-minute redeem run would silently
# evict a pending `/game-state` upload that Discord has already acknowledged.
# `max` holds up to 100 pending runs in FIFO order. See
# docs/ARCHITECTURE.md → "Writer serialization" for the overflow contract.
# `queue: max` must never be combined with `cancel-in-progress: true`.
concurrency:
  group: stfc-gift-redeemer
  queue: max
  cancel-in-progress: false

jobs:
  redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Issue #241: the ruleset that protects `main` cannot be satisfied by a
      # direct scheduled push (required status checks only run on pull
      # requests), and its bypass_actors cannot accept the built-in
      # `github-actions` identity on this org/plan. State therefore lives on
      # `automation-state` — a ref the ruleset's ~DEFAULT_BRANCH condition
      # never matches — instead of on `main`. Restore it here so this run
      # continues from the latest claims/dead-code cache rather than main's
      # frozen, possibly-stale checked-out copies.
      - name: Restore automation state from automation-state branch
        id: restore_state
        run: |
          set -euo pipefail
          RESTORE_DIR="$RUNNER_TEMP/automation-state-restore"
          rm -rf "$RESTORE_DIR"
          git worktree prune

          if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
            git fetch --depth=1 --no-tags origin \
              refs/heads/automation-state:refs/remotes/origin/automation-state
            git worktree add --detach "$RESTORE_DIR" origin/automation-state

            if [ -f "$RESTORE_DIR/docs/redeem-history.md" ]; then
              mkdir -p docs
              cp "$RESTORE_DIR/docs/redeem-history.md" docs/redeem-history.md
            else
              echo "docs/redeem-history.md is not on automation-state yet; preserving the main seed."
            fi
            if [ -f "$RESTORE_DIR/data/promo-code-dead.json" ]; then
              mkdir -p data
              cp "$RESTORE_DIR/data/promo-code-dead.json" data/promo-code-dead.json
            else
              echo "data/promo-code-dead.json is not on automation-state yet; preserving the main seed."
            fi
            if [ -f "$RESTORE_DIR/data/redeem-degraded-state.json" ]; then
              mkdir -p data
              cp "$RESTORE_DIR/data/redeem-degraded-state.json" data/redeem-degraded-state.json
            else
              echo "data/redeem-degraded-state.json is not on automation-state yet; preserving the main seed."
            fi
            if [ -f "$RESTORE_DIR/promo-codes.txt" ]; then
              MAIN_SHA=$(git rev-parse HEAD)
              node scripts/merge-promo-codes.mjs \
                promo-codes.txt "$RESTORE_DIR/promo-codes.txt" promo-codes.txt "$MAIN_SHA"
            else
              echo "promo-codes.txt is not on automation-state yet; preserving the main seed."
            fi

            git worktree remove "$RESTORE_DIR" --force
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to inspect origin/automation-state."
              exit "$status"
            fi
            echo "automation-state does not exist yet; main's files are the first-run seed."
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Redeem
        id: redeem
        env:
          STFC_ACCOUNTS: ${{ secrets.STFC_ACCOUNTS }}
        run: |
          set +e
          npm run skill:run-all
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Exit code 2 means every account's token was rejected by the store, so
      # the run claims nothing until STFC_ACCOUNTS is refreshed. Redemption
      # silently stopped for 11 days (2026-08-02 to 2026-08-13) because a dead
      # token produced no signal anyone saw. Raise one issue and keep it open
      # rather than filing a duplicate every 10 minutes.
      - name: Alert on dead token
        if: always() && steps.redeem.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "STFC token rejected — redemption is stopped until STFC_ACCOUNTS is refreshed"
          REQUIRED_LABELS: "bug,priority:p1"
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(node scripts/dead-token-alert.mjs find)

          if [ -n "$existing" ]; then
            echo "Alert already open as #$existing — not filing a duplicate."
            printf 'Token still rejected as of %s\n' "$run_url" \
              | gh issue comment "$existing" --body-file -
            exit 0
          fi

          {
            echo "The redeem workflow exited 2: every account's token was rejected by"
            echo "the store. **No gifts are being claimed** until \`STFC_ACCOUNTS\` is"
            echo "refreshed."
            echo ""
            echo "Failing run: $run_url"
            echo ""
            echo "Note the JWT may still look valid — \`/auth/me\` can return 200 while"
            echo "\`GET /offers/gifts?available=true\` returns 401. Trust this alert over"
            echo "the \`exp\` claim."
            echo ""
            echo "To fix, re-capture the token and update the secret, either:"
            echo ""
            echo "1. run \`npm run capture-token -- --name main\` locally (a browser opens;"
            echo "   Scopely emails a 6-digit code), then answer \`y\` to set the secret, or"
            echo "2. dispatch \`Refresh token\` twice — once to trigger the code email, then"
            echo "   again passing that code as the \`otp\` input."
            echo ""
            echo "Close this issue once a run claims gifts again."
          } > /tmp/alert-body.md

          gh issue create --title "$TITLE" \
            --label "squad,squad:uhura,bug,priority:p1" \
            --body-file /tmp/alert-body.md

      # Self-resolving half of the alert (retro #243): a dead-token alert
      # that's still open must not sit there once the token is accepted
      # again — a P1 that silently stays "open" long after it self-healed
      # trains the operator to distrust the channel. Close it automatically
      # the first time a run is no longer in the all-tokens-rejected state.
      #
      # Both halves share one selection implementation
      # (scripts/dead-token-alert.mjs), so the create-side and resolve-side
      # notions of "which issue is the alert" cannot drift apart.
      - name: Auto-resolve dead-token alert
        if: always() && steps.redeem.outputs.exit_code == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "STFC token rejected — redemption is stopped until STFC_ACCOUNTS is refreshed"
          REQUIRED_LABELS: "bug,priority:p1"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dead-token-alert.mjs resolve

      - name: Sync persistent degraded-gift alert
        if: always() && steps.redeem.outputs.exit_code == '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_FILE: data/redeem-degraded-state.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/degraded-gift-alert.mjs sync

      - name: Commit redeem state to automation-state (if changed)
        if: always() && steps.restore_state.outputs.complete == 'true'
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/automation-state"
          rm -rf "$STATE_DIR"
          git worktree prune

          branch_exists=false
          if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
            git fetch --depth=1 --no-tags origin \
              refs/heads/automation-state:refs/remotes/origin/automation-state
            git worktree add -B automation-state "$STATE_DIR" origin/automation-state
            branch_exists=true
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to inspect origin/automation-state."
              exit "$status"
            fi
            echo "Bootstrapping automation-state in an authenticated linked worktree."
            git worktree add --detach "$STATE_DIR" HEAD
            git -C "$STATE_DIR" switch --orphan automation-state
            git -C "$STATE_DIR" rm -rf --cached --ignore-unmatch .
          fi

          if [ -f docs/redeem-history.md ]; then
            mkdir -p "$STATE_DIR/docs"
            cp docs/redeem-history.md "$STATE_DIR/docs/redeem-history.md"
          fi
          if [ -f data/redeem-degraded-state.json ]; then
            mkdir -p "$STATE_DIR/data"
            cp data/redeem-degraded-state.json "$STATE_DIR/data/redeem-degraded-state.json"
          fi
          if [ -f data/promo-code-dead.json ]; then
            mkdir -p "$STATE_DIR/data"
            cp data/promo-code-dead.json "$STATE_DIR/data/promo-code-dead.json"
          fi
          if [ -f promo-codes.txt ]; then
            cp promo-codes.txt "$STATE_DIR/promo-codes.txt"
          fi

          git -C "$STATE_DIR" config user.name  "github-actions[bot]"
          git -C "$STATE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$STATE_DIR/docs/redeem-history.md" ]; then
            git -C "$STATE_DIR" add -A -- docs/redeem-history.md
          fi
          if [ -f "$STATE_DIR/data/promo-code-dead.json" ]; then
            git -C "$STATE_DIR" add -A -- data/promo-code-dead.json
          fi
          if [ -f "$STATE_DIR/data/redeem-degraded-state.json" ]; then
            git -C "$STATE_DIR" add -A -- data/redeem-degraded-state.json
          fi
          if [ -f "$STATE_DIR/promo-codes.txt" ]; then
            git -C "$STATE_DIR" add -A -- promo-codes.txt
          fi
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "Redeem history, dead-code cache, degraded-gift state, and promo codes are unchanged."
            git worktree remove "$STATE_DIR" --force
            exit 0
          fi
          NEW_LINES=$(git -C "$STATE_DIR" diff --cached --numstat -- docs/redeem-history.md | awk '{print $1}')
          NEW_LINES="${NEW_LINES:-0}"
          # --no-verify: npm ci installs the developer pre-commit hook, which
          # runs the full test suite. CI must not gate recording claims on that.
          git -C "$STATE_DIR" commit --no-verify -m "chore(history): append ${NEW_LINES} new claim row(s) [skip ci]"
          # Bounded rebase-then-push retry: up to 3 attempts to absorb a
          # concurrent push. A failed rebase is always visible — never swallowed.
          for attempt in 1 2 3; do
            if git -C "$STATE_DIR" push --no-verify origin "HEAD:automation-state"; then
              git worktree remove "$STATE_DIR" --force
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed; pulling with rebase before retry…"
              if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
                node scripts/automation-state-retry.mjs \
                  "$STATE_DIR" automation-state \
                  docs/redeem-history.md data/promo-code-dead.json \
                  data/redeem-degraded-state.json promo-codes.txt
                branch_exists=true
              else
                status=$?
                if [ "$status" -ne 2 ]; then
                  echo "::error::Unable to inspect origin/automation-state before retry."
                  exit "$status"
                fi
                if [ "$branch_exists" = true ]; then
                  echo "::error::origin/automation-state disappeared during push retry."
                  exit 1
                fi
                echo "origin/automation-state is still absent; retrying the first push without pull."
              fi
            fi
          done
          echo "::error::All 3 push attempts failed — investigate concurrent workflow conflicts."
          exit 1
