# Scheduled web-store gift redemption.
#
# Reads STFC store JWTs from the STFC_ACCOUNTS secret (a JSON array of
# {name, token} objects) and runs the orchestrator against every account.
#
# Per-account outcomes (claimed, already-claimed, token-expired, code-used,
# etc.) do NOT fail the workflow — they are surfaced in the run summary.
# Only infrastructure failures (malformed secret, schema mismatch, uncaught
# crash) cause a non-zero exit.
name: Redeem gifts

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: read

# Prevent cron + manual dispatch from racing.
concurrency:
  group: stfc-gift-redeemer
  cancel-in-progress: false

jobs:
  redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run skill:run-all
        env:
          STFC_ACCOUNTS: ${{ secrets.STFC_ACCOUNTS }}
