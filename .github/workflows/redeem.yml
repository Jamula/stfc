# Scheduled web-store gift redemption.
#
# Reads STFC store JWTs from the STFC_ACCOUNTS secret (a JSON array of
# {name, token} objects) and runs the orchestrator against every account.
#
# Per-account outcomes (claimed, already-claimed, token-expired, code-used,
# etc.) do NOT fail the workflow — they are surfaced in the run summary.
# Only infrastructure failures (malformed secret, schema mismatch, uncaught
# crash) cause a non-zero exit.
name: Redeem gifts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes — 6x/hour, 144/day (was */15).
  workflow_dispatch: {}

permissions:
  # `write` so the post-run step can commit any new rows in
  # docs/redeem-history.md back to the repo using the default GITHUB_TOKEN.
  contents: write

# Opt into the Node 24 runtime for actions/* internals (default June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Prevent cron + manual dispatch from racing.
concurrency:
  group: stfc-gift-redeemer
  cancel-in-progress: false

jobs:
  redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run skill:run-all
        env:
          STFC_ACCOUNTS: ${{ secrets.STFC_ACCOUNTS }}

      - name: Commit redeem history (if changed)
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/redeem-history.md)" ]; then
            echo "No new redeem history rows to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/redeem-history.md
          NEW_LINES=$(git diff --cached --numstat docs/redeem-history.md | awk '{print $1}')
          git commit -m "chore(history): append ${NEW_LINES} new claim row(s) [skip ci]"
          # Retry-once on push race against a concurrent workflow.
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

