name: Squad Test Gate
# Single CI gate for the repo — consolidates the former Tests + Squad CI
# workflows. Runs typecheck + the test suite on every pull request.
#
# The job is named "npm test (required)" so it can be enforced as a required
# status check in GitHub -> Settings -> Branches -> Branch protection rules.
# See: .squad/decisions/inbox/scotty-test-gate-built.md

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read

# Opt into the Node 24 runtime for actions/* internals (default June 2026).
# Silences the "Node 20 actions are deprecated" warning in run logs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Avoid redundant in-flight runs for the same ref/event.
concurrency:
  group: test-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gate:
    name: npm test (required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:coverage

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report-typescript
          path: coverage/cobertura-coverage.xml

  upload-coverage-typescript:
    needs: test-gate
    if: ${{ !cancelled() && needs.test-gate.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: coverage-report-typescript

      - uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1  # v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
