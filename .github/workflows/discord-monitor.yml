# Scheduled Discord-monitor run.
#
# Ingests new messages from operator-curated Discord channels, extracts
# candidate STFC promo codes, classifies tips, and hands fresh codes off
# to the existing redeem orchestrator. Read-only against Discord.
#
# Cron: 15 min past every 4th hour (15-min stagger from redeem.yml's
# `0 * * * *`) so a redeemer run finishes before the monitor run starts
# under the shared concurrency group. The shared group serializes all
# repo-writing workflows (promo-codes.txt, data/, docs/redeem-history.md).
#
# Per-account redemption outcomes (used, expired, invalid) do NOT fail the
# workflow — only infrastructure errors do. Same posture as redeem.yml.
name: Discord monitor

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch: {}

permissions:
  # `write` so the post-run step can commit any new state + digest + auto-
  # appended promo codes back to the repo using the default GITHUB_TOKEN.
  contents: write

# Opt into the Node 24 runtime for actions/* internals (default June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# MUST match redeem.yml bit-for-bit (group AND queue) so cron + dispatch +
# redeem runs serialize on a single push lock — preventing colliding git push
# attempts. `queue: max` keeps up to 100 shared-group runs pending in FIFO
# order; the default `single` would let this workflow's runs cancel a pending
# `/game-state` upload. See docs/ARCHITECTURE.md → "Writer serialization".
concurrency:
  group: stfc-gift-redeemer
  queue: max
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Issue #241: state lives on `automation-state`, not `main` — see
      # redeem.yml for the full rationale (ruleset can't be satisfied by a
      # direct push, and its bypass_actors can't accept `github-actions`).
      - name: Restore automation state from automation-state branch
        id: restore_state
        run: |
          set -euo pipefail
          RESTORE_DIR="$RUNNER_TEMP/automation-state-restore"
          rm -rf "$RESTORE_DIR"
          git worktree prune

          if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
            git fetch --depth=1 --no-tags origin \
              refs/heads/automation-state:refs/remotes/origin/automation-state
            git worktree add --detach "$RESTORE_DIR" origin/automation-state
            MAIN_SHA=$(git rev-parse HEAD)
            node scripts/discord-monitor-state.mjs restore \
              "$RESTORE_DIR" "$GITHUB_WORKSPACE" "$MAIN_SHA"

            git worktree remove "$RESTORE_DIR" --force
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to inspect origin/automation-state."
              exit "$status"
            fi
            echo "automation-state does not exist yet; main's files are the first-run seed."
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/classifier-model.json') }}

      - run: npm ci

      - run: npm run skill:discord-monitor
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          STFC_ACCOUNTS: ${{ secrets.STFC_ACCOUNTS }}

      - name: Commit state + digest + promo-codes to automation-state (if changed)
        if: always() && steps.restore_state.outputs.complete == 'true'
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/automation-state"
          rm -rf "$STATE_DIR"
          git worktree prune

          branch_exists=false
          if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
            git fetch --depth=1 --no-tags origin \
              refs/heads/automation-state:refs/remotes/origin/automation-state
            git worktree add -B automation-state "$STATE_DIR" origin/automation-state
            branch_exists=true
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to inspect origin/automation-state."
              exit "$status"
            fi
            echo "Bootstrapping automation-state in an authenticated linked worktree."
            git worktree add --detach "$STATE_DIR" HEAD
            git -C "$STATE_DIR" switch --orphan automation-state
            git -C "$STATE_DIR" rm -rf --cached --ignore-unmatch .
          fi

          node scripts/discord-monitor-state.mjs persist \
            "$GITHUB_WORKSPACE" "$STATE_DIR"

          git -C "$STATE_DIR" config user.name  "github-actions[bot]"
          git -C "$STATE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$STATE_DIR/data/discord/cursors.json" ]; then
            git -C "$STATE_DIR" add -A -- data/discord/cursors.json
          fi
          if [ -f "$STATE_DIR/data/discord/candidates.jsonl" ]; then
            git -C "$STATE_DIR" add -A -- data/discord/candidates.jsonl
          fi
          if [ -f "$STATE_DIR/data/discord/tips-seen.jsonl" ]; then
            git -C "$STATE_DIR" add -A -- data/discord/tips-seen.jsonl
          fi
          if [ -f "$STATE_DIR/data/discord/cooldowns.json" ]; then
            git -C "$STATE_DIR" add -A -- data/discord/cooldowns.json
          fi
          if [ -d "$STATE_DIR/data/digests" ]; then
            git -C "$STATE_DIR" add -A -- data/digests
          fi
          if [ -f "$STATE_DIR/promo-codes.txt" ]; then
            git -C "$STATE_DIR" add -A -- promo-codes.txt
          fi
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "No state/digest/promo-codes changes to commit."
            git worktree remove "$STATE_DIR" --force
            exit 0
          fi
          git -C "$STATE_DIR" commit --no-verify -m "chore(discord-monitor): run ${{ github.run_id }}"
          for attempt in 1 2 3; do
            if git -C "$STATE_DIR" push --no-verify origin "HEAD:automation-state"; then
              git worktree remove "$STATE_DIR" --force
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed; pulling with rebase before retry…"
              if git ls-remote --exit-code --heads origin automation-state >/dev/null; then
                node scripts/automation-state-retry.mjs \
                  "$STATE_DIR" automation-state \
                  data/discord/cursors.json data/discord/candidates.jsonl \
                  data/discord/tips-seen.jsonl data/discord/cooldowns.json \
                  data/digests promo-codes.txt
                branch_exists=true
              else
                status=$?
                if [ "$status" -ne 2 ]; then
                  echo "::error::Unable to inspect origin/automation-state before retry."
                  exit "$status"
                fi
                if [ "$branch_exists" = true ]; then
                  echo "::error::origin/automation-state disappeared during push retry."
                  exit 1
                fi
                echo "origin/automation-state is still absent; retrying the first push without pull."
              fi
            fi
          done
          echo "::error::All 3 push attempts failed — investigate concurrent workflow conflicts."
          exit 1
