# CI for the rebuild: typecheck + tests on every push/PR.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request: {}

permissions:
  contents: read

# Opt into the Node 24 runtime for actions/* internals (default June 2026).
# Silences the "Node 20 actions are deprecated" warning in run logs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
