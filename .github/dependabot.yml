version: 2
# Routine updates are grouped; major updates remain separate by dependency.
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/pwa-browser"
    schedule:
      interval: "weekly"
    groups:
      playwright:
        patterns:
          - "playwright"
        group-by: "dependency-name"
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/pwa-token-api"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
