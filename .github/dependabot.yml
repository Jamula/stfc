version: 2
# Intended reviewers by ecosystem (Squad roles, not GitHub reviewer handles):
#   npm / and /web: Scotty (package owner) and O'Brien (security/dependency triage)
#   npm /worker and /api: Uhura (package owner) and O'Brien (security/dependency triage)
#   github-actions: O'Brien (security/tooling)
# Minor and patch updates are grouped; major updates remain separate pull requests.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      routine:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
